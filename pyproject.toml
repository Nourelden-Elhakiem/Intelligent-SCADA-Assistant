[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-scada"
version = "0.3.1"
description = "A production-oriented document ingestion and RAG pipeline for SCADA manuals."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{name = "Intelligent SCADA Assistant contributors"}]
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "huggingface-hub>=0.20,<2",
    "langchain-core>=1.0,<2",
    "pydantic>=2.9,<3",
    "numpy>=1.26,<2.3",
    "Pillow>=10,<13",
    "psycopg2-binary>=2.9,<3",
    "PyMuPDF>=1.24,<2",
    "python-dotenv>=1,<2",
    "python-multipart>=0.0.12,<1",
    "sentence-transformers>=3,<6",
    "torch>=2.2,<3",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "jupyterlab>=4,<5",
    "mypy>=1.11,<2",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.8,<1",
    "types-psycopg2>=2.9",
]

[project.scripts]
intelligent-scada = "intelligent_scada.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
intelligent_scada = [
    "py.typed",
    "database/migrations/*.sql",
    "static/index.html",
    "static/*.png",
    "static/assets/*",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "database: requires a PostgreSQL instance with pgvector",
]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402", "F401", "I001"]

[tool.mypy]
python_version = "3.11"
files = ["src/intelligent_scada"]
warn_unused_configs = true
warn_return_any = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
no_site_packages = true
